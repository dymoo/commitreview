name: Shipyard Cloud Reviewer
description: Read-only, adversarial AI code review for Shipyard draft pull requests.
author: Shipyard contributors

branding:
  icon: git-pull-request
  color: purple

inputs:
  api-key:
    description: API key for the OpenAI-compatible endpoint. Pass a secret, never a literal.
    required: true
  base-url:
    description: Base URL of the OpenAI-compatible API, including its version path.
    required: true
  model:
    description: Model id as the provider names it.
    required: true
  reasoning-effort:
    description: Optional low, medium, high, xhigh, or max effort passed unchanged.
    required: false
    default: ''
  github-token:
    description: Token used to read the pull request and post comments.
    required: false
    default: ${{ github.token }}
  handoff-token:
    description: Shared secret used only to verify Coder dispatch proofs. Never placed in event payloads or model context.
    required: false
    default: ''
  instructions:
    description: Extra repository-specific review guidance.
    required: false
    default: ''
  ignore:
    description: Newline-separated path globs added to the built-in ignore list.
    required: false
    default: ''

outputs:
  findings:
    description: Number of findings that survived verification.
  reviewed:
    description: 'true when a review ran; false when the event did not request one.'

runs:
  using: node20
  main: src/index.js
